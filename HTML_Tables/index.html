<!DOCTYPE html>


<html>

<!-- head: the head of the site ; title: the title on the tab bar -->
<head><title>Super Ballon D'or</title></head>

<body>
     <!-- The align property allows for the alignment of a certain HTML element. -->
    <h1 align = "center">Super Ballon D'or Leaders</h1>
    <!-- Use 'table' to create a table. the bgcolor attribute allows you to change the color of your table. -->
    <!-- Width proportionally changes the width of your table. -->

    <!-- Lets go over some of the tags in this section:
    * tr : table row - makes a table row
    * th : table header - makes a table header inside the row
    * td : table data - makes a table data cell (where you can store data) inside your table row.
    
    * P.S. The statistics shown below are not real statistics, but are just for an example for what you can store in a table.

    -->
    <table bgcolor="black" align = "center" width = "300">
        <!-- Row 1 -->
        
        <tr bgcolor="Grey" align = "center"> 
          <th width = "100">Nominees</th>
          <th width = "100">Points</th>
          <th width = "100">Percentage</th>
        </tr>

        <!-- Row 2 -->
         <tr bgcolor = "Gold" align = "center">
           <td>Lionel Messi</td> 
           <td>32,641</td>
           <td>71%</td>  
         </tr>

         <!-- Row 3 -->

         <tr bgcolor = "Silver" align = "center">
           <td>Cristiano Ronaldo</td> 
           <td>9,664</td>
           <td>21%</td>  
         </tr>

         <!-- Row 4 -->

          <tr bgcolor = "Bronze" align = "center">
           <td>Ronaldo (Nazário)</td> 
           <td>1,265</td>
           <td>3%</td>  
         </tr>
           <!-- Row 5 -->
         <tr bgcolor = "light grey" align = "center">
           <td>Ronaldinho</td> 
           <td>708</td>
           <td>2%</td>  
         </tr>

         <!-- Row 6 -->
          <tr bgcolor = "light grey" align = "center">
           <td>Ricardo Kaká</td> 
           <td>556</td>
           <td>1%</td>  
         </tr>

    </table>






</body>





</html>
